version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    # Minor and patch updates share one pull request; every major update gets
    # its own, so one breaking release cannot hold the others back.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
