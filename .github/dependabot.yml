version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      toolchain:
        patterns: ["@babel/*", "typescript", "@biomejs/*", "bun-plugin-tailwind", "tailwindcss", "postcss"]
      workspace:
        patterns: ["*"]
