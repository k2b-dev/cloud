name: Bug report
description: Something in Cloud behaves incorrectly.
labels: [bug, needs-triage]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: The application id (for example `mail`, `grids`, `core`, `gateway`), `cli`, `login` (the PWA), `platform`, `ci`, or `docs`.
      placeholder: mail
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` reported by `/_cloud/ready` of the affected application, or the `sha-` tag of a main-branch build.
      placeholder: 0.8.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the response, log line, or screenshot. Remove secrets and personal data.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks work completely
        - Major degradation or frequent failure
        - Minor bug or occasional failure
        - Cosmetic
    validations:
      required: true
