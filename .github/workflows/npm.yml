name: npm publish

# Publish @k2b/cloud to npm via OIDC trusted publisher.
#
# Trigger: tag matching `npm-cloud-v*` (e.g. npm-cloud-v0.2.0).
# Avoids the `cloud-*-v*` pattern owned by docker.yml.
#
# First publish was done manually from a workstation. From there on,
# bumping the version means: bump packages/cloud/package.json, commit,
# tag, push.
#
# Trusted publisher must be configured on npmjs.org for the package
# (Repository: k2b-dev/cloud, Workflow: npm.yml). No NPM_TOKEN.

on:
  push:
    tags:
      - "npm-cloud-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/cloud
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (workspace root)
        working-directory: .
        run: bun ci --registry=https://registry.npmjs.org

      - name: Verify platform checks and types
        working-directory: .
        run: bun run check

      - name: Verify client and workflow contracts
        working-directory: .
        run: bun test packages/cloud-cli/src packages/cloud/src/workflows/module.test.ts packages/grids/test/help.test.ts

      - name: Require published Sync recovery support
        working-directory: .
        run: |
          bun -e 'const root = await Bun.file("package.json").json(); if (Object.keys(root.patchedDependencies ?? {}).some(name => name.startsWith("@k2b/sync@"))) throw new Error("Publish and adopt the reviewed Sync release before publishing Cloud to npm; downstream consumers do not inherit this workspace patch.")'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11.5.1+
        run: npm install -g npm@11.5.1

      - name: Validate release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = process.env.GITHUB_EVENT_NAME === "workflow_dispatch"
              ? process.env.REQUESTED_VERSION : process.env.GITHUB_REF_NAME.replace(/^npm-cloud-v/, "");
            if (!/^\d+\.\d+\.\d+$/.test(version) || p.version !== version) throw new Error("Release version must match package.json");
          '

      - name: Publish
        run: npm publish --provenance --access public
