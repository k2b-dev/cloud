name: Sync runtime integration

on:
  pull_request:
    paths: ["packages/**", "compose.yml", "bun.lock", ".github/workflows/sync.yml"]
  push:
    branches: [main]
    paths: ["packages/**", "compose.yml", "bun.lock", ".github/workflows/sync.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYNC_TEST_SERVERS: nats://127.0.0.1:4222
      NOTEBOOKS_NATS_TEST: "1"
      CLOUD_SYNC_NATS_TEST: "1"
      GRIDS_SYNC_TEST: "1"
      NATS_IGNORE_CLUSTER_UPDATES: "true"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Start persistent three-node JetStream cluster
        run: docker compose -f compose.yml up -d --wait nats-1 nats-2 nats-3
      - name: Verify replay and cursor boundaries
        run: |
          bun test packages/cloud/src/services/notifications/live.integration.test.ts
          bun test packages/notebooks/src/service/yjs-sync.integration.test.ts
          bun test packages/contacts/src/service/events.integration.test.ts
          bun test packages/spaces/src/service/events.integration.test.ts
          bun test packages/grids/src/service/record-events.integration.test.ts packages/grids/src/service/workflow-run-events.integration.test.ts
      - name: Cluster diagnostics
        if: failure()
        run: docker compose -f compose.yml logs --tail 100 nats-1 nats-2 nats-3
      - name: Stop isolated CI cluster
        if: always()
        run: docker compose -f compose.yml down --volumes
