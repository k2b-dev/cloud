name: Sync runtime integration

on:
  pull_request:
    paths: ["packages/**", "scripts/**", "compose.yml", "bun.lock", ".github/workflows/sync.yml"]
  push:
    branches: [main]
    paths: ["packages/**", "scripts/**", "compose.yml", "bun.lock", ".github/workflows/sync.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYNC_TEST_SERVERS: nats://127.0.0.1:4222
      # Same cluster; packages/grids/src/sync-test-utils.ts still reads this name.
      NATS_TEST_SERVERS: nats://127.0.0.1:4222
      NOTEBOOKS_NATS_TEST: "1"
      CLOUD_SYNC_NATS_TEST: "1"
      GRIDS_SYNC_TEST: "1"
      NOTEBOOKS_SNAPSHOT_DB_TEST: "1"
      GRIDS_EVIDENCE_CLEANUP_DB_TEST: "1"
      GRIDS_RECORD_EVENTS_DB_TEST: "1"
      GRIDS_DB_TEST: "1"
      DATABASE_URL: postgres://ipa:ipa@127.0.0.1:5432/ipa
      NATS_IGNORE_CLUSTER_UPDATES: "true"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Start three-node JetStream cluster and isolated test database server
        run: docker compose -f compose.yml up -d --wait nats-1 nats-2 nats-3 postgres
      - name: Create core and gateway database schemas
        run: |
          bun -e 'import { runCoreSetup } from "./packages/core/src/runtime-helpers"; await runCoreSetup()'
          bun -e 'import { migrate } from "./packages/gateway-ops/src/migrate"; await migrate()'
      - name: Verify replay and cursor boundaries
        run: |
          bun test packages/cloud/src/services/notifications/live.integration.test.ts
          bun test packages/notebooks/src/service/yjs-sync.integration.test.ts packages/notebooks/src/service/yjs-snapshot-ordering.integration.test.ts
          bun test packages/notebooks/src/service/presence.test.ts
          bun test packages/contacts/src/service/events.integration.test.ts
          bun test packages/spaces/src/service/events.integration.test.ts
          bun test packages/grids/src/service/workflow-run-events.integration.test.ts
          # Path filter: runs every record-event* test (replay, outbox, native retry, PostgreSQL runtime).
          bun test packages/grids/src/service/record-event
      - name: Verify restore, shutdown and cleanup regressions
        run: |
          bun test packages/notebooks/src/ws-lifecycle.test.ts packages/notebooks/src/service/yjs-snapshot.integration.test.ts
          bun test packages/notebooks/scripts/snapshot-cutover-preflight.integration.test.ts
          bun test packages/grids/src/service/evidence-cleanup.integration.test.ts
          bun test packages/cloud/src/services/runtime-lifecycle.test.ts packages/cloud/src/services/notifications/batches-retry.test.ts
          bun test packages/cloud/src/services/account-lifecycle/ipa-backfill.test.ts
          bun test packages/gateway/src/runtime.test.ts
          bun run --filter @valentinkolb/cloud-app-gateway-ops test:integration
      - name: Verify operator scripts
        run: bun test scripts
      - name: Cluster diagnostics
        if: failure()
        run: docker compose -f compose.yml logs --tail 100 nats-1 nats-2 nats-3
      - name: Stop isolated CI cluster
        if: always()
        run: docker compose -f compose.yml down --volumes
