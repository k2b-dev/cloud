name: CodeQL

# Scans what reaches main instead of every pull request push or merge queue
# group, so pull request and queue CI keep their runners. Main records the
# merged state, and the weekly run picks up new queries for unchanged code.
# CodeQL is not part of `gate`: a finding shows up in code scanning after the
# merge, it never blocks one.
#
# This advanced setup replaces the repository's CodeQL default setup, which
# must stay "not configured"; with both active, these uploads are rejected.

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same ref supersedes an unfinished scan.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # c-cpp covers packages/runner/native; build-mode none needs no compiler.
        language: [actions, c-cpp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
