name: CI

# One workflow gates every change. `gate` is the only required status check:
# it needs every other job and passes only when each one succeeded or, for a
# path-filtered job, was skipped by its own `if:`. Any other result, such as
# failure, cancelled, timed_out, or abandoned during an Actions outage, fails it.

# No job installs from the runner's apt mirror: its outages hang apt-get
# without output until the job times out. Chromium's system libraries come
# with the image's Google Chrome, so Playwright installs only the browser;
# WebKit runs in the Playwright image, which brings its libraries; Poppler
# runs from a pinned image through .github/poppler.sh, as Homebrew downloads
# its API index from formulae.brew.sh before every install.

# No job pulls from Docker Hub either: its anonymous pull limit failed runs.
# Its images come from ghcr.io/k2b-dev/mirror at the digests pinned in
# .github/mirror-images.txt. Service containers and Dockerfiles name the
# mirror; steps pull through .github/pull-images.sh, which tags each mirrored
# image with its Docker Hub name for `docker run` and test fixtures. The
# `mirror` job runs first and copies an image that is not mirrored yet.

# Pull requests run the gate on the branch; the merge queue runs it once more
# on the exact merge result and merges only when it passed. main itself is
# never re-verified here: main.yml starts straight from the push.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2
  TEST_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cloud: ${{ steps.filter.outputs.cloud }}
      grids: ${{ steps.filter.outputs.grids }}
      ui: ${{ steps.filter.outputs.ui }}
      docs: ${{ steps.filter.outputs.docs }}
      images: ${{ steps.filter.outputs.images }}
      packed: ${{ steps.filter.outputs.packed }}
      webkit: ${{ steps.filter.outputs.webkit }}
      bundles: ${{ steps.filter.outputs.bundles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          apps=$(bun scripts/workspace.ts apps | xargs)
          all() { for key in cloud grids ui docs images packed webkit; do echo "$key=true" >> "$GITHUB_OUTPUT"; done; echo "bundles=$apps" >> "$GITHUB_OUTPUT"; }
          if [[ "$EVENT" == "workflow_dispatch" || -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            all; exit 0
          fi
          git fetch --quiet --depth=1 origin "$BASE" || { all; exit 0; }
          changed=$(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "$changed"
          match() { grep -qE "$1" <<<"$changed" && echo true || echo false; }
          shared='^(packages/cloud/|packages/core/|packages/gateway/|packages/ssr/|scripts/|patches/|package\.json|bun\.lock|bunfig\.toml|tsconfig|styles\.css|Dockerfile|\.dockerignore|\.github/(workflows/|nats-ci\.conf|pull-images\.sh|poppler\.sh|mirror-images\.(txt|sh)))'
          # Workspaces with tests that `bun run test --browser` runs: they start a browser through
          # packages/ui/test/browser.ts and need no integration targets. Some import tests/fixtures/.
          browser=$(git grep -lF '/test/browser"' -- 'packages/*' 'pwas/*' ':!*.integration.test.ts' | cut -d/ -f1-2 | sort -u | paste -sd '|')
          # An application's production bundle depends on its package, the shared inputs, and the
          # non-application packages: @k2b/ui, and packages/cloud-cli, whose install script core bundles.
          bundles=()
          for app in $apps; do
            if [[ "$(match "$shared|^packages/(ui|cloud-cli)/|^packages/$app/")" == true ]]; then bundles+=("$app"); fi
          done
          {
            echo "cloud=$(match "$shared")"
            echo "grids=$(match '^packages/grids/')"
            echo "ui=$(match '^(packages/ui/|packages/ssr/|fixtures/ui-ssr/)')"
            echo "docs=$(match '^(docs-site/|skills/)')"
            echo "images=$(match '^(Dockerfile|\.dockerignore|docs-site/Dockerfile|pwas/|compose[^/]*\.yml)')"
            echo "packed=$(match '^(packages/cloud/|packages/gateway/src/config\.ts|packages/ui/|packages/ssr/|packages/core/src/|scripts/check-cloud-packed-consumer\.ts|scripts/fixtures/packed-consumer-)')"
            echo "webkit=$(match "$shared|^tests/fixtures/|^($browser)/")"
            echo "bundles=${bundles[*]}"
          } | tee -a "$GITHUB_OUTPUT"

  # Copies listed images that the mirror lacks; every job that pulls a Docker Hub image needs it.
  mirror:
    uses: ./.github/workflows/mirror-images.yml
    permissions:
      contents: read
      packages: write

  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - run: bun run --cwd packages/ui build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: packages/ui/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  check:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a Conventional Commit pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [[ ! "$TITLE" =~ ^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?:\ .+ ]]; then
            echo "Pull request title must follow Conventional Commits (type(scope)!: summary): $TITLE" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: packages/ui/dist
      - run: bun run check

  unit:
    needs: [setup, mirror]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # API-level unit tests go through the rate limiter, whose Bun redis client
    # waits for a server; a throwaway Valkey keeps them honest and fast.
    services:
      valkey:
        image: &valkey-image ghcr.io/k2b-dev/mirror/valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLOUD_TEST_VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: packages/ui/dist
      - name: Install the Playwright browser used by the unit tests that launch Chromium
        run: ./packages/assistant/node_modules/.bin/playwright install chromium
      - run: bun run test --shard ${{ matrix.shard }}/3
        env:
          # Unit tests of encrypted settings and grants derive keys from the application secret.
          APP_SECRET: ${{ env.TEST_SECRET }}

  # The browser tests again in WebKit, the engine of Safari and of every
  # browser on iOS. The Playwright image of the catalog's version serves it
  # through `playwright run-server`; contributing/testing.md runs the same
  # locally. It runs in two shards so that it stays shorter than the
  # integration job.
  webkit:
    needs: [changes, setup]
    if: needs.changes.outputs.webkit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TEST_BROWSER: webkit
      TEST_BROWSER_ENDPOINT: ws://127.0.0.1:3333/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Start WebKit in the Playwright image
        run: |
          set -euo pipefail
          version=$(jq -r '.workspaces.catalog.playwright' package.json)
          "$GITHUB_WORKSPACE/.github/pull-images.sh" "mcr.microsoft.com/playwright:v$version-noble"
          docker run --detach --name playwright --network host --init --ipc=host --user pwuser --workdir /home/pwuser \
            "mcr.microsoft.com/playwright:v$version-noble" npx -y "playwright@$version" run-server --port 3333 --host 127.0.0.1
      - run: bun ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: packages/ui/dist
      - name: Wait for the Playwright server
        run: timeout 120s bash -c 'until docker logs playwright 2>&1 | grep -q "Listening on"; do sleep 1; done'
      - run: bun run test --browser --shard ${{ matrix.shard }}/2
      - if: always()
        run: |
          docker logs playwright 2>&1 | tail -50
          docker rm --force playwright

  integration:
    needs: [setup, mirror]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: &postgres-17-image ghcr.io/k2b-dev/mirror/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: cloud
          POSTGRES_DB: cloud_ci_test
          # Log every statement that takes 250 ms or longer, with its plan, so
          # a slow run can be told apart from a slow database. The runner
          # prints the service log under "Stop containers"; the log options
          # below bound it. See contributing/testing.md.
          POSTGRES_INITDB_ARGS: &postgres-diagnostics >-
            -c shared_preload_libraries=auto_explain
            -c "log_line_prefix=%m [%p] %q%d %a: "
            -c log_min_duration_statement=250ms
            -c log_parameter_max_length=256
            -c auto_explain.log_min_duration=250ms
            -c auto_explain.log_analyze=off
            -c auto_explain.log_nested_statements=on
            -c auto_explain.log_parameter_max_length=256
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloud -d cloud_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
          --log-opt max-size=4m --log-opt max-file=2
      valkey:
        image: *valkey-image
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      gotenberg:
        image: &gotenberg-image ghcr.io/k2b-dev/mirror/gotenberg/gotenberg:8.36.0@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
        ports: ["3001:3000"]
    env:
      CLOUD_TEST_DATABASE_URL: postgres://cloud:cloud@127.0.0.1:5432/cloud_ci_test
      CLOUD_TEST_NATS_SERVERS: nats://127.0.0.1:4222
      CLOUD_TEST_VALKEY_URL: redis://127.0.0.1:6379
      CLOUD_TEST_GOTENBERG_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Start NATS JetStream and install poppler
        run: |
          set -euo pipefail
          # The Files Filegate suites, the Notebooks shared-log suite and the Assistant artifact suite start their own containers from these images.
          "$GITHUB_WORKSPACE/.github/pull-images.sh" nats:2.14.3-alpine ghcr.io/k2b-dev/filegate:7.0.0 debian:13-slim postgres:17-alpine ghcr.io/k2b-dev/rsql:1.0.0
          docker run --detach --name ci-nats --publish 127.0.0.1:4222:4222 --volume "$GITHUB_WORKSPACE/.github/nats-ci.conf:/etc/nats.conf:ro" nats:2.14.3-alpine --config /etc/nats.conf
          "$GITHUB_WORKSPACE/.github/poppler.sh" install
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 "$CLOUD_TEST_GOTENBERG_URL/health"
      - run: bun ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: packages/ui/dist
      - name: Install the Playwright browser used by the Assistant code host
        run: ./packages/assistant/node_modules/.bin/playwright install chromium
      # Grids certification runs in its own sharded job below.
      - run: bun run test --integration --exclude grids
      - if: always()
        run: docker rm --force ci-nats

  grids:
    needs: [changes, setup, mirror]
    if: needs.changes.outputs.grids == 'true' || needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      valkey:
        image: *valkey-image
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      gotenberg:
        image: *gotenberg-image
        ports: ["3001:3000"]
    env:
      CLOUD_TEST_DATABASE_URL: postgres://grids_test:grids_test@127.0.0.1:5432/grids_test
      CLOUD_TEST_NATS_SERVERS: nats://127.0.0.1:4222
      CLOUD_TEST_VALKEY_URL: redis://127.0.0.1:6379
      CLOUD_TEST_GOTENBERG_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Start certification infrastructure
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/pull-images.sh" nats:2.14.3-alpine postgres:15-alpine
          "$GITHUB_WORKSPACE/.github/poppler.sh" install
          # Match the connection budget in compose.yml and compose.sync-test.yml.
          # Slow statements and plans as in the integration job; PostgreSQL 15
          # has no auto_explain.log_parameter_max_length.
          docker run --detach --name grids-postgres --publish 127.0.0.1:5432:5432 \
            --log-opt max-size=4m --log-opt max-file=2 \
            --env POSTGRES_USER=grids_test --env POSTGRES_PASSWORD=grids_test --env POSTGRES_DB=grids_test \
            postgres:15-alpine -c max_connections=300 \
            -c shared_preload_libraries=auto_explain -c "log_line_prefix=%m [%p] %q%d %a: " \
            -c log_min_duration_statement=250ms -c log_parameter_max_length=256 \
            -c auto_explain.log_min_duration=250ms -c auto_explain.log_analyze=off \
            -c auto_explain.log_nested_statements=on
          docker run --detach --name grids-nats --publish 127.0.0.1:4222:4222 --volume "$GITHUB_WORKSPACE/.github/nats-ci.conf:/etc/nats.conf:ro" nats:2.14.3-alpine --config /etc/nats.conf
          timeout 60s bash -c 'until docker exec grids-postgres pg_isready -U grids_test -d grids_test; do sleep 1; done'
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 "$CLOUD_TEST_GOTENBERG_URL/health"
      - run: bun ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: packages/ui/dist
      - run: bun run --cwd packages/grids test:all --shard ${{ matrix.shard }}/3
        env:
          GRIDS_VERIFY_REPORTS_DIR: ${{ runner.temp }}/grids-certification
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grids-certification-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grids-certification
          if-no-files-found: ignore
      - name: Print the Postgres log and remove containers
        if: always()
        run: |
          echo "::group::grids-postgres log"
          docker logs grids-postgres 2>&1 || true
          echo "::endgroup::"
          docker rm --force grids-postgres grids-nats

  ui:
    needs: [changes, setup]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - run: bun run --cwd packages/ui build
      - run: bun run --cwd packages/ui typecheck
      - name: Install the Playwright browser used by the touch-target test
        run: ./packages/ui/node_modules/.bin/playwright install chromium
      - run: bun run --cwd packages/ui test
      - run: bun run --cwd packages/ui fixture:typecheck
      - run: bun run --cwd packages/ui fixture:build

  docs:
    needs: [changes, setup]
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: packages/ui/dist
      - run: bun run --cwd docs-site verify:docs
      - name: Smoke-test the built site
        env:
          NODE_ENV: production
          PORT: "4187"
          CLOUD_DOCS_SITE_URL: http://localhost:3000
          CLOUD_UI_CATALOG_URL: http://127.0.0.1:4187
        run: |
          set -euo pipefail
          bun run --cwd docs-site start > "$RUNNER_TEMP/docs-site.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4187/health > /dev/null; then
              bun run --cwd docs-site check:ui-catalog:http
              exit 0
            fi
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done
          cat "$RUNNER_TEMP/docs-site.log"
          exit 1

  packed:
    needs: [changes, setup, mirror]
    if: needs.changes.outputs.packed == 'true' || needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: *postgres-17-image
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: cloud
          POSTGRES_DB: cloud_packed_test
          POSTGRES_INITDB_ARGS: *postgres-diagnostics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloud -d cloud_packed_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
          --log-opt max-size=4m --log-opt max-file=2
      valkey:
        image: *valkey-image
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLOUD_TEST_DATABASE_URL: postgres://cloud:cloud@127.0.0.1:5432/cloud_packed_test
      CLOUD_TEST_NATS_SERVERS: nats://127.0.0.1:4222
      CLOUD_TEST_VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: |
          set -euo pipefail
          # The packed runtime check starts its own Postgres 15, Valkey and NATS containers.
          "$GITHUB_WORKSPACE/.github/pull-images.sh" nats:2.14.3-alpine postgres:15-alpine valkey/valkey:8-alpine
          docker run --detach --name packed-nats --publish 127.0.0.1:4222:4222 --volume "$GITHUB_WORKSPACE/.github/nats-ci.conf:/etc/nats.conf:ro" nats:2.14.3-alpine --config /etc/nats.conf
      - run: bun ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: packages/ui/dist
      - run: bun scripts/check-cloud-packed-consumer.ts
      - if: always()
        run: docker rm --force packed-nats

  # The production build rejects what development and the tests accept, such
  # as a Bun builtin reaching browser code. Run the build step of each affected
  # application's image, without Docker.
  bundles:
    needs: [changes, setup]
    if: needs.changes.outputs.bundles != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: packages/ui/dist
      - name: Build the production bundle of each affected application
        env:
          NODE_ENV: production
          APPS: ${{ needs.changes.outputs.bundles }}
        run: |
          set -euo pipefail
          failed=()
          for app in $APPS; do
            echo "::group::$app"
            APP_ID="$app" bun run packages/cloud/scripts/build.ts || failed+=("$app")
            echo "::endgroup::"
          done
          [[ ${#failed[@]} -eq 0 ]] || { echo "::error::Production bundle failed for: ${failed[*]}"; exit 1; }

  images:
    needs: [changes, mirror]
    if: needs.changes.outputs.images == 'true' || needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit from the mirror instead of Docker Hub (.github/mirror-images.txt).
          driver-opts: image=ghcr.io/k2b-dev/mirror/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: cloud-core:ci
          build-args: |
            APP_ID=core
            CLOUD_VERSION=0.0.0-ci
            CLOUD_RELEASE=sha-${{ github.sha }}
          cache-from: type=gha,scope=ci-core
          cache-to: type=gha,mode=max,scope=ci-core
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: cloud-gateway:ci
          build-args: |
            APP_ID=gateway
            CLOUD_VERSION=0.0.0-ci
            CLOUD_RELEASE=sha-${{ github.sha }}
          cache-from: type=gha,scope=ci-gateway
          cache-to: type=gha,mode=max,scope=ci-gateway
      # The Cloud Login image runs its typecheck and tests inside the build; a
      # missing file in its narrow COPY set only shows up here, not in bun run test.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: pwas/pwa-auth/Dockerfile
          platforms: linux/amd64
          build-args: |
            CLOUD_VERSION=0.0.0-ci
            CLOUD_RELEASE=sha-${{ github.sha }}
          cache-from: type=gha,scope=ci-pwa-auth
          cache-to: type=gha,mode=max,scope=ci-pwa-auth
      - name: Boot core and gateway against fresh infrastructure
        env:
          APP_SECRET: ${{ env.TEST_SECRET }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/pull-images.sh" nats:2.14.3-alpine postgres:17-alpine valkey/valkey:8-alpine
          docker network create cloud-smoke
          docker run --detach --name postgres --network cloud-smoke \
            --env POSTGRES_USER=ipa --env POSTGRES_PASSWORD=ipa --env POSTGRES_DB=ipa postgres:17-alpine
          docker run --detach --name nats --network cloud-smoke --volume "$GITHUB_WORKSPACE/.github/nats-ci.conf:/etc/nats.conf:ro" nats:2.14.3-alpine --config /etc/nats.conf
          docker run --detach --name valkey --network cloud-smoke valkey/valkey:8-alpine
          timeout 60s bash -c 'until docker exec postgres pg_isready -U ipa -d ipa; do sleep 1; done'
          # compose.dev.yml x-env with the service names of this throwaway network.
          common=(--network cloud-smoke
            --env NODE_ENV=production
            --env DATABASE_URL=postgresql://ipa:ipa@postgres:5432/ipa
            --env REDIS_URL=redis://valkey:6379
            --env NATS_SERVERS=nats://nats:4222
            --env SYNC_REPLICAS=1
            --env SYNC_NAMESPACE=ci
            --env APP_SECRET="$APP_SECRET"
            --env CLOUD_IDENTITY_JWKS_ORIGIN=http://app-core:3000
            --env CLOUD_OAUTH_JWKS_ORIGIN=http://app-oauth:3000
            --env CLOUD_CORE_INTERNAL_ORIGIN=http://app-core:3000)
          docker run --detach --name app-core "${common[@]}" \
            --env CLOUD_IDENTITY_KEY_ENCRYPTION_KEY=000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f \
            --env CLOUD_OAUTH_BROKER_SECRET=abababababababababababababababababababababababababababababababab \
            --env ADMIN_LOGIN_TOKEN=ci-admin \
            --publish 127.0.0.1:3001:3000 cloud-core:ci
          docker run --detach --name gateway "${common[@]}" --publish 127.0.0.1:3000:3000 cloud-gateway:ci
          for container in app-core gateway; do
            [[ "$(docker exec "$container" id -u)" != "0" ]] || { echo "$container runs as root" >&2; exit 1; }
          done
          for _attempt in {1..90}; do
            ready=$(curl --silent --fail http://127.0.0.1:3001/_cloud/ready || true)
            routes=$(curl --silent --fail http://127.0.0.1:3000/health | jq -r '.routeTable.routeCount // 0' || echo 0)
            if [[ -n "$ready" && "$routes" -ge 1 ]]; then
              echo "core ready: $ready"
              echo "gateway routes: $routes"
              exit 0
            fi
            sleep 2
          done
          docker logs app-core; docker logs gateway
          exit 1
      - if: always()
        run: docker rm --force app-core gateway postgres nats valkey || true

  gate:
    needs: [changes, mirror, setup, check, unit, webkit, integration, grids, ui, docs, packed, bundles, images]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          # The path-filtered jobs, whose `if:` reads the `changes` outputs.
          # Only they may be skipped; every other job must succeed (`ci-gate` check).
          MAY_SKIP: webkit grids ui docs packed bundles images
        run: |
          set -euo pipefail
          jq -e 'type == "object" and length > 0' <<<"$RESULTS" >/dev/null || { echo "The gate got no job results" >&2; exit 1; }
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r --arg maySkip "$MAY_SKIP" '
            ($maySkip | split(" ")) as $maySkip
            | [to_entries[]
                | select(.value.result != "success" and (.value.result != "skipped" or (.key | IN($maySkip[]) | not)))
                | "\(.key) (\(.value.result))"]
            | join(", ")')
          [[ -z "$failed" ]] || { echo "Jobs that did not pass: $failed" >&2; exit 1; }
