name: Nightly

# Slow or environment-sensitive checks that do not gate pull requests.
# Like ci.yml, no job installs from the runner's apt mirror or pulls from
# Docker Hub: its images come from ghcr.io/k2b-dev/mirror, see ci.yml.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2

jobs:
  integration:
    name: integration (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: 15
            image: ghcr.io/k2b-dev/mirror/postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
          - postgres: 17
            image: ghcr.io/k2b-dev/mirror/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    services:
      clickhouse:
        image: ghcr.io/k2b-dev/mirror/clickhouse/clickhouse-server:26.9.19.9@sha256:bdb5c911a23d92fd364e246ab20b5a0a485f00112f3663fa626b083fb46c146b
        env:
          CLICKHOUSE_USER: cloud_ci
          CLICKHOUSE_PASSWORD: cloud_ci
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -q -O - http://127.0.0.1:8123/ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: cloud
          POSTGRES_DB: cloud_nightly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloud -d cloud_nightly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: &valkey-image ghcr.io/k2b-dev/mirror/valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      gotenberg:
        image: &gotenberg-image ghcr.io/k2b-dev/mirror/gotenberg/gotenberg:8.36.0@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
        ports: ["3001:3000"]
    env:
      CLOUD_TEST_CLICKHOUSE_URL: http://cloud_ci:cloud_ci@127.0.0.1:8123
      CLOUD_TEST_DATABASE_URL: postgres://cloud:cloud@127.0.0.1:5432/cloud_nightly_test
      CLOUD_TEST_NATS_SERVERS: nats://127.0.0.1:4222
      CLOUD_TEST_VALKEY_URL: redis://127.0.0.1:6379
      CLOUD_TEST_GOTENBERG_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: |
          set -euo pipefail
          # The Files Filegate suites, the Notebooks shared-log suite and the Assistant artifact suite start their own containers from these images.
          "$GITHUB_WORKSPACE/.github/pull-images.sh" nats:2.14.3-alpine ghcr.io/k2b-dev/filegate:7.1.0 debian:13-slim postgres:17-alpine ghcr.io/k2b-dev/rsql:1.0.0
          docker run --detach --name nightly-nats --publish 127.0.0.1:4222:4222 --volume "$GITHUB_WORKSPACE/.github/nats-ci.conf:/etc/nats.conf:ro" nats:2.14.3-alpine --config /etc/nats.conf
          "$GITHUB_WORKSPACE/.github/poppler.sh" install
      - uses: ./.github/actions/install
      - run: bun run --cwd packages/ui build
      - name: Install the Playwright browser used by the Assistant code host and Mail tests
        run: ./packages/assistant/node_modules/.bin/playwright install chromium
      # Grids certification has its own job below.
      - run: bun run test --integration --exclude grids
      - if: always()
        run: docker rm --force nightly-nats

  grids:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      valkey:
        image: *valkey-image
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      gotenberg:
        image: *gotenberg-image
        ports: ["3001:3000"]
    env:
      CLOUD_TEST_DATABASE_URL: postgres://grids_test:grids_test@127.0.0.1:5432/grids_test
      CLOUD_TEST_NATS_SERVERS: nats://127.0.0.1:4222
      CLOUD_TEST_VALKEY_URL: redis://127.0.0.1:6379
      CLOUD_TEST_GOTENBERG_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/pull-images.sh" nats:2.14.3-alpine postgres:15-alpine
          "$GITHUB_WORKSPACE/.github/poppler.sh" install
          docker run --detach --name grids-postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=grids_test --env POSTGRES_PASSWORD=grids_test --env POSTGRES_DB=grids_test \
            postgres:15-alpine -c max_connections=300
          docker run --detach --name grids-nats --publish 127.0.0.1:4222:4222 --volume "$GITHUB_WORKSPACE/.github/nats-ci.conf:/etc/nats.conf:ro" nats:2.14.3-alpine --config /etc/nats.conf
          timeout 60s bash -c 'until docker exec grids-postgres pg_isready -U grids_test -d grids_test; do sleep 1; done'
      - uses: ./.github/actions/install
      - run: bun run --cwd packages/ui build
      - run: bun run --cwd packages/grids test:all
        env:
          GRIDS_VERIFY_REPORTS_DIR: ${{ runner.temp }}/grids-certification
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-grids-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grids-certification
          if-no-files-found: ignore
      - if: always()
        run: docker rm --force grids-postgres grids-nats

  nats-cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLOUD_TEST_DATABASE_URL: postgres://ipa:ipa@127.0.0.1:5432/ipa_test
      CLOUD_TEST_NATS_SERVERS: nats://127.0.0.1:4222
      CLOUD_TEST_NATS_CREDS_FILE: ${{ github.workspace }}/.local/nats-sync-test/test.creds
      CLOUD_TEST_VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/install
      - run: bun run --cwd packages/ui build
      - name: Prepare the local NATS accounts
        run: bun -e 'import { prepareDevNats } from "./packages/gateway-ops/scripts/dev-nats"; await prepareDevNats(".local/nats-sync-test")'
      - name: Validate the generated NATS configuration
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/pull-images.sh" nats:2.14.3-alpine postgres:15-alpine docker.io/valkey/valkey:8-alpine
          docker compose -f compose.sync-test.yml run --rm --no-deps nats-1 --config /etc/nats/nats.conf -t
      - name: Start the three-node JetStream cluster
        run: |
          set -euo pipefail
          docker compose -f compose.sync-test.yml up -d --wait nats-1 nats-2 nats-3 postgres valkey
          docker compose -f compose.sync-test.yml exec -T postgres psql -U ipa -d ipa -c 'CREATE DATABASE ipa_test'
      - name: NATS account diagnostics and process-sync failover
        env:
          NATS_DIAGNOSTICS_TEST: "1"
          NATS_ADMIN_NKEY_SEED_FILE: .local/nats-sync-test/admin.seed
        run: |
          set -euo pipefail
          bun test --preload ./scripts/fixtures/test-infra.ts packages/gateway-ops/src/observability/nats/service.integration.test.ts
          bun test --preload ./scripts/fixtures/test-infra.ts packages/cloud/src/_internal/process-sync.test.ts
      - if: failure()
        run: docker compose -f compose.sync-test.yml logs --tail 100 nats-1 nats-2 nats-3
      - if: always()
        run: docker compose -f compose.sync-test.yml down --volumes

  shared-text:
    name: Shared text merge and repair (10,000 schedules)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/install
      - run: bun run --cwd packages/ui build
      - name: Replay the retained Undo witness and anchor regressions
        run: bun --no-env-file test --preload ./scripts/fixtures/test-infra.ts packages/cloud/test/shared-text-table-fuzz.test.ts
      - name: Run realistic and adversarial schedules
        run: |
          set -o pipefail
          bun --no-env-file packages/cloud/test/shared-text-table-fuzz.ts --cases 5000 --start 1 --profile both | tee shared-text-fuzz.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shared-text-fuzz
          path: shared-text-fuzz.jsonl

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/install
      - run: bun run --cwd packages/ui build
      - run: ./packages/assistant/node_modules/.bin/playwright install chromium
      # Only the Playwright suites; the DOM suites of this directory run in the unit job with browser conditions.
      # globstar includes the suites in subdirectories such as runtime/.
      - run: |
          shopt -s globstar
          bun test --timeout 30000 --preload ./scripts/fixtures/test-infra.ts packages/assistant/src/artifacts/**/*.browser.test.ts

  browser-smoke:
    # The Grids, Mail and Chat smokes drive a running Cloud, so this job boots one from this commit's images.
    # It is separate from the browser job so that an Assistant failure cannot hide whether the stack boots.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/install
      - run: bun run --cwd packages/ui build
      - run: ./packages/grids/node_modules/.bin/playwright install chromium
      # The Chat smoke's phone runs in WebKit, which the Playwright image serves as in ci.yml's webkit job.
      - name: Start WebKit in the Playwright image
        run: .github/start-playwright.sh
      - name: Build the Core, gateway, Accounts, Grids, Mail and Chat images
        run: |
          set -euo pipefail
          for app in core gateway accounts grids mail chat; do
            docker build --build-arg APP_ID="$app" --build-arg CLOUD_VERSION=0.0.0-nightly \
              --build-arg CLOUD_RELEASE="sha-$GITHUB_SHA" --tag "cloud-$app:nightly" .
          done
      - name: Boot Core, gateway, Accounts, Grids, Mail and Chat against fresh infrastructure
        env:
          # Production refuses to issue sessions for a non-HTTPS public origin.
          APP_URL: https://cloud.nightly-smoke.test
          APP_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/pull-images.sh" nats:2.14.3-alpine postgres:17-alpine valkey/valkey:8-alpine
          docker network create cloud-smoke
          # Mail seeds its mailbox and Chat cleans up its chat through the published Postgres port.
          docker run --detach --name postgres --network cloud-smoke --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=ipa --env POSTGRES_PASSWORD=ipa --env POSTGRES_DB=ipa postgres:17-alpine
          docker run --detach --name nats --network cloud-smoke --volume "$GITHUB_WORKSPACE/.github/nats-ci.conf:/etc/nats.conf:ro" nats:2.14.3-alpine --config /etc/nats.conf
          docker run --detach --name valkey --network cloud-smoke valkey/valkey:8-alpine
          timeout 60s bash -c 'until docker exec postgres pg_isready -U ipa -d ipa; do sleep 1; done'
          # Apps restart until Core has migrated the shared schemas, as in compose.prod.yml.
          common=(--network cloud-smoke --restart unless-stopped
            --env NODE_ENV=production
            --env APP_URL="$APP_URL"
            --env DATABASE_URL=postgresql://ipa:ipa@postgres:5432/ipa
            --env REDIS_URL=redis://valkey:6379
            --env NATS_SERVERS=nats://nats:4222
            --env SYNC_REPLICAS=1
            --env SYNC_NAMESPACE=nightly
            --env APP_SECRET="$APP_SECRET"
            --env CLOUD_IDENTITY_JWKS_ORIGIN=http://app-core:3000
            --env CLOUD_OAUTH_JWKS_ORIGIN=http://app-oauth:3000
            --env CLOUD_CORE_INTERNAL_ORIGIN=http://app-core:3000)
          docker run --detach --name app-core "${common[@]}" \
            --env CLOUD_IDENTITY_KEY_ENCRYPTION_KEY=000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f \
            --env CLOUD_OAUTH_BROKER_SECRET=abababababababababababababababababababababababababababababababab \
            --env ADMIN_LOGIN_TOKEN=nightly-admin \
            cloud-core:nightly
          docker run --detach --name gateway "${common[@]}" --publish 127.0.0.1:3000:3000 cloud-gateway:nightly
          docker run --detach --name app-accounts "${common[@]}" cloud-accounts:nightly
          docker run --detach --name app-chat "${common[@]}" cloud-chat:nightly
          docker run --detach --name app-grids "${common[@]}" cloud-grids:nightly
          docker run --detach --name app-mail "${common[@]}" cloud-mail:nightly
          # Each app serves its OpenAPI document without a session once the gateway routes to it.
          for _attempt in {1..90}; do
            routed=0
            for spec in /api/openapi.json /api/accounts/openapi.json /api/chat/openapi.json /api/grids/openapi.json /api/mail/openapi.json; do
              curl --silent --fail --output /dev/null "http://127.0.0.1:3000$spec" && routed=$((routed + 1))
            done
            if [[ "$routed" -eq 5 ]]; then exit 0; fi
            sleep 2
          done
          echo "Core, Accounts, Grids, Mail and Chat did not become routable through the gateway." >&2
          exit 1
      - name: Run the Grids, Mail and Chat browser smokes
        env:
          APP_URL: https://cloud.nightly-smoke.test
          # Mail seeds its fixture and Chat deletes its chat through their persistence boundaries.
          DATABASE_URL: postgresql://ipa:ipa@127.0.0.1:5432/ipa
        run: |
          set -euo pipefail
          printf 'nightly-admin\n' > "$RUNNER_TEMP/admin-token"
          # A first sign-in stays pending until the account accepts the legal documents, as in the release smoke.
          token=$(curl --silent --fail-with-body -X POST http://127.0.0.1:3000/api/auth/admin-login \
            -H 'content-type: application/json' --data '{"token":"nightly-admin"}' | jq -r .session_token)
          version=$(curl --silent --show-error --fail-with-body -H "cookie: session_token=$token" http://127.0.0.1:3000/auth/continue \
            | grep -oE 'data-legal-version="[a-f0-9]{64}"' | grep -oE '[a-f0-9]{64}') || { echo "::error::Could not read data-legal-version from /auth/continue." >&2; exit 1; }
          curl --silent --fail-with-body -X POST http://127.0.0.1:3000/api/auth/legal-consent \
            -H "authorization: Bearer $token" -H "origin: $APP_URL" -H 'content-type: application/json' \
            --data "{\"accepted\":true,\"version\":\"$version\"}"
          failed=()
          for app in grids mail chat; do
            echo "::group::$app"
            extra=()
            if [[ "$app" == grids || "$app" == chat ]]; then
              extra+=(--app-url "$APP_URL")
            fi
            if [[ "$app" == chat ]]; then
              extra+=(--webkit-endpoint ws://127.0.0.1:3333/)
            fi
            bun "packages/$app/scripts/browser-smoke.ts" --base-url http://127.0.0.1:3000 --admin-token-file "$RUNNER_TEMP/admin-token" "${extra[@]}" || failed+=("$app")
            echo "::endgroup::"
          done
          [[ ${#failed[@]} -eq 0 ]] || { echo "::error::Browser smoke failed for: ${failed[*]}"; exit 1; }
      - if: failure()
        run: for container in app-core gateway app-accounts app-chat app-grids app-mail playwright; do docker logs --tail 200 "$container" || true; done
      - if: always()
        run: docker rm --force app-core gateway app-accounts app-chat app-grids app-mail playwright postgres nats valkey || true

  scale-acceptance:
    # Nightly: a path-filtered PR job would rebuild five images on every Cloud change.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/install
      - run: bun run --cwd packages/ui build
      - run: bun scripts/scale-acceptance.ts

  runtime-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/install
      - run: bun run --cwd packages/ui build
      - run: bun packages/cloud/scripts/runtime-recovery-acceptance.ts

  ubuntu-next:
    # Early warning for the ubuntu-latest migration; never gates anything.
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/install
      - run: bun run --cwd packages/ui build
      - run: bun run check
      - name: Install the Playwright browser used by the Assistant code host and Mail tests
        run: ./packages/assistant/node_modules/.bin/playwright install chromium
      - name: Fetch the Bun runtime that the standalone CLI test compiles into cld
        # Retry the prefetch as in ci.yml; the test reuses Bun's cached runtime.
        timeout-minutes: 7
        run: CLD_TARGETS=linux_x64 CLD_OUTPUT_DIR="$RUNNER_TEMP/cld-runtime" .github/retry.sh timeout 120s bun run packages/cloud-cli/scripts/build.ts
      - run: bun run test --shard 1/3

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/install
      - run: bun run --cwd packages/ui build
      - run: bun run check dependencies
      - run: bun audit --audit-level=high
