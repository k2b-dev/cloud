name: Nightly

# Slow or environment-sensitive checks that do not gate pull requests.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: cloud
          POSTGRES_DB: cloud_nightly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloud -d cloud_nightly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      gotenberg:
        image: gotenberg/gotenberg:8.36.0
        ports: ["3001:3000"]
    env:
      CLOUD_TEST_DATABASE_URL: postgres://cloud:cloud@127.0.0.1:5432/cloud_nightly_test
      CLOUD_TEST_NATS_SERVERS: nats://127.0.0.1:4222
      CLOUD_TEST_VALKEY_URL: redis://127.0.0.1:6379
      CLOUD_TEST_GOTENBERG_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: |
          set -euo pipefail
          docker run --detach --name nightly-nats --publish 127.0.0.1:4222:4222 nats:2.14.3-alpine -js
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - run: bun ci
      - run: bun run --cwd packages/ui build
      - run: bun run test --integration
      - if: always()
        run: docker rm --force nightly-nats

  grids:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      gotenberg:
        image: gotenberg/gotenberg:8.36.0
        ports: ["3001:3000"]
    env:
      CLOUD_TEST_DATABASE_URL: postgres://grids_test:grids_test@127.0.0.1:5432/grids_test
      CLOUD_TEST_NATS_SERVERS: nats://127.0.0.1:4222
      CLOUD_TEST_VALKEY_URL: redis://127.0.0.1:6379
      CLOUD_TEST_GOTENBERG_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          docker run --detach --name grids-postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=grids_test --env POSTGRES_PASSWORD=grids_test --env POSTGRES_DB=grids_test \
            postgres:15-alpine -c max_connections=300
          docker run --detach --name grids-nats --publish 127.0.0.1:4222:4222 nats:2.14.3-alpine -js
          timeout 60s bash -c 'until docker exec grids-postgres pg_isready -U grids_test -d grids_test; do sleep 1; done'
      - run: bun ci
      - run: bun run --cwd packages/ui build
      - run: bun run --cwd packages/grids test:all
      - if: always()
        run: docker rm --force grids-postgres grids-nats

  nats-cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLOUD_TEST_DATABASE_URL: postgres://ipa:ipa@127.0.0.1:5432/ipa_test
      CLOUD_TEST_NATS_SERVERS: nats://127.0.0.1:4222
      CLOUD_TEST_VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - run: bun run --cwd packages/ui build
      - name: Prepare the local NATS system account
        run: bun -e 'import { prepareDevNats } from "./packages/gateway-ops/scripts/dev-nats"; await prepareDevNats(".local/nats-sync-test")'
      - name: Validate the generated NATS configuration
        run: docker compose -f compose.sync-test.yml run --rm --no-deps nats-1 --config /etc/nats/nats.conf -t
      - name: Start the three-node JetStream cluster
        run: |
          set -euo pipefail
          docker compose -f compose.sync-test.yml up -d --wait nats-1 nats-2 nats-3 postgres valkey
          docker compose -f compose.sync-test.yml exec -T postgres psql -U ipa -d ipa -c 'CREATE DATABASE ipa_test'
      - name: NATS account diagnostics and process-sync failover
        env:
          NATS_DIAGNOSTICS_TEST: "1"
          NATS_ADMIN_NKEY_SEED_FILE: .local/nats-sync-test/admin.seed
        run: |
          set -euo pipefail
          bun test --preload ./scripts/fixtures/test-infra.ts packages/gateway-ops/src/observability/nats/service.integration.test.ts
          bun test --preload ./scripts/fixtures/test-infra.ts packages/cloud/src/_internal/process-sync.test.ts
      - if: failure()
        run: docker compose -f compose.sync-test.yml logs --tail 100 nats-1 nats-2 nats-3
      - if: always()
        run: docker compose -f compose.sync-test.yml down --volumes

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - run: bun run --cwd packages/ui build
      - run: bunx playwright install --with-deps chromium
      - run: bun test --preload ./scripts/fixtures/test-infra.ts packages/assistant/src/artifacts/
      - run: |
          set -euo pipefail
          for script in packages/grids/scripts/browser-smoke.ts packages/mail/scripts/browser-smoke.ts; do
            if [[ -f "$script" ]]; then bun "$script"; fi
          done

  runtime-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - run: bun run --cwd packages/ui build
      - run: bun packages/cloud/scripts/runtime-recovery-acceptance.ts

  ubuntu-next:
    # Early warning for the ubuntu-latest migration; never gates anything.
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - run: bun run --cwd packages/ui build
      - run: bun run check
      - run: bun run test --shard 1/3

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - run: bun run check dependencies
      - run: bun audit --audit-level=high
