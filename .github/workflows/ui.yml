name: UI certification

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: "@k2b/ui"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun ci

      - name: Build package
        run: bun run --cwd packages/ui build

      - name: Typecheck package
        run: bun run --cwd packages/ui typecheck

      - name: Build and test package
        run: bun run --cwd packages/ui test

      - name: Typecheck standalone fixture
        run: bun run --cwd packages/ui fixture:typecheck

      - name: Build standalone fixture
        run: bun run --cwd packages/ui fixture:build

  catalog:
    name: Fibel UI catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun ci

      - name: Verify documentation and build website
        run: bun run --cwd docs-site verify:docs

      - name: Smoke-test built UI catalog
        env:
          NODE_ENV: production
          PORT: "4187"
          CLOUD_DOCS_SITE_URL: http://localhost:3000
          CLOUD_UI_CATALOG_URL: http://127.0.0.1:4187
        run: |
          bun run --cwd docs-site start > /tmp/cloud-ui-catalog.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4187/health > /dev/null; then
              bun run --cwd docs-site check:ui-catalog:http
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/cloud-ui-catalog.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/cloud-ui-catalog.log
          exit 1
