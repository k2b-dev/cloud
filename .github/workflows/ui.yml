name: UI certification

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: "@k2b/ui"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install UI dependencies
        run: bun ci --filter @k2b/ui

      - name: Build package
        run: bun run --cwd packages/ui build

      - name: Typecheck package
        run: bun run --cwd packages/ui typecheck

      - name: Build and test package
        run: bun run --cwd packages/ui test

      - name: Typecheck standalone fixture
        run: bun run --cwd packages/ui fixture:typecheck

      - name: Build standalone fixture
        run: bun run --cwd packages/ui fixture:build
