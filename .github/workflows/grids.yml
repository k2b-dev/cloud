name: Grids certification

on:
  pull_request:
    paths:
      - ".github/workflows/grids.yml"
      - "packages/cloud/**"
      - "packages/core/**"
      - "packages/grids/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/grids.yml"
      - "packages/cloud/**"
      - "packages/core/**"
      - "packages/grids/**"
      - "packages/ui/**"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grids-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Typecheck and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun ci

      - name: Build shared UI package
        run: bun run --cwd packages/ui build

      - name: Typecheck Grids
        run: bun run --cwd packages/grids typecheck

      - name: Run fast Grids tests
        run: bun run --cwd packages/grids test

  database:
    name: Custom App DB seam
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ipa
          POSTGRES_PASSWORD: ipa
          POSTGRES_DB: ipa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipa -d ipa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgresql://ipa:ipa@localhost:5432/ipa
      GRIDS_DB_TEST: "1"
      APP_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install workspace dependencies
        run: bun ci

      - name: Build shared UI package
        run: bun run --cwd packages/ui build

      - name: Create core database schema
        run: bun -e 'import { runCoreSetup } from "./packages/core/src/runtime-helpers"; await runCoreSetup()'

      - name: Run the Custom App API seam
        run: bun test packages/grids/src/api/custom-apps.integration.test.ts --max-concurrency 1
