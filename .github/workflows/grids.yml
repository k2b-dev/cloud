name: Grids certification

on:
  pull_request:
    paths:
      - ".github/workflows/grids.yml"
      - ".github/workflows/docker.yml"
      - "packages/cloud/**"
      - "packages/core/**"
      - "packages/grids/**"
      - "packages/ui/**"
      - "skills/cloud-cli/references/grids.md"
      - "patches/**"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "styles.css"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: grids-certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Full integrity verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      gotenberg:
        image: gotenberg/gotenberg:8.36.0
        ports: ["3001:3000"]
    env:
      DATABASE_URL: postgres://grids_test:grids_test@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
      SYNC_TEST_SERVERS: nats://127.0.0.1:4222
      GRIDS_PDF_URL: http://127.0.0.1:3001
      APP_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Prepare verification infrastructure
        run: |
          mkdir -p "$RUNNER_TEMP/grids-certification"
          echo "GRIDS_VERIFY_REPORTS_DIR=$RUNNER_TEMP/grids-certification" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          # Match the connection budget in compose.yml and compose.sync-test.yml.
          docker run --detach --name grids-certification-postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=grids_test --env POSTGRES_PASSWORD=grids_test --env POSTGRES_DB=postgres \
            postgres:15-alpine -c max_connections=300
          timeout 60s bash -c 'until docker exec grids-certification-postgres pg_isready -U grids_test -d postgres; do sleep 1; done'
          docker run --detach --name grids-certification-nats --publish 127.0.0.1:4222:4222 nats:2.14.3-alpine --jetstream
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 "$GRIDS_PDF_URL/health"

      - name: Install workspace dependencies
        run: bun ci

      - name: Build shared UI package
        run: bun run --cwd packages/ui build

      - name: Typecheck Grids without filtering diagnostics
        run: bunx --no-install tsc -p packages/grids/tsconfig.json --noEmit --pretty false 2>&1 | tee "$GRIDS_VERIFY_REPORTS_DIR/typecheck.log"

      - name: Run all Grids and shared workflow tests without skips
        run: bun run --cwd packages/grids test:all 2>&1 | tee "$GRIDS_VERIFY_REPORTS_DIR/verification.log"

      - name: Retain verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grids-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grids-certification
          if-no-files-found: error

      - name: Remove test infrastructure
        if: ${{ always() }}
        run: docker rm --force grids-certification-nats grids-certification-postgres
