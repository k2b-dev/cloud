name: Release

# Reusable release pipeline called from main.yml after release-please created
# a release. The images were already built once by main.yml for this commit
# (tagged sha-<12> and vX.Y.Z); this workflow consumes that run's
# `release-images` artifact instead of building again. Runs on refs/heads/main,
# so the Cosign certificate identity of checksums.txt is
# `.github/workflows/release.yml@refs/heads/main`.

on:
  workflow_call:
    inputs:
      version:
        description: Cloud version (X.Y.Z) of the root component release
        required: true
        type: string
      sha:
        description: Commit the release was cut from
        required: true
        type: string
      cloud_released:
        required: true
        type: boolean
      npm_cloud_released:
        required: true
        type: boolean
      npm_ui_released:
        required: true
        type: boolean

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2
  TEST_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

jobs:
  verify-tag:
    if: inputs.cloud_released
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-tags: true
      - id: tag
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Cloud releases are stable X.Y.Z versions." >&2; exit 1; }
          git fetch --quiet origin "refs/tags/cloud-v$VERSION:refs/tags/cloud-v$VERSION"
          tagged=$(git rev-list -n1 "cloud-v$VERSION")
          [[ "$tagged" == "$SHA" ]] || { echo "Tag cloud-v$VERSION points at $tagged, expected $SHA." >&2; exit 1; }
          [[ "$(jq -r .version packages/cloud-cli/package.json)" == "$VERSION" ]] || { echo "packages/cloud-cli/package.json is not $VERSION." >&2; exit 1; }

  cli-build:
    needs: verify-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin_arm64
          - runner: macos-15-intel
            target: darwin_x64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: ubuntu-24.04
            target: linux_x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - run: bun run --cwd packages/ui build
      - name: Build CLI binary
        env:
          CLD_VERSION: ${{ inputs.version }}
          CLD_COMMIT: ${{ inputs.sha }}
          CLD_TARGETS: ${{ matrix.target }}
          CLD_OUTPUT_DIR: release
        run: bun run --cwd packages/cloud-cli build
      - name: Smoke test native binary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          binary="packages/cloud-cli/release/cld_${{ matrix.target }}"
          "$binary" --version | grep -F "$VERSION"
          "$binary" help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cld-${{ matrix.target }}
          path: packages/cloud-cli/release/cld_${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  cli-assets:
    needs: cli-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cld-*
          path: release
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Cosign 3 writes only Sigstore bundles; checksums.txt.sig/.pem and
          # `cld update` expect the detached signature and certificate (#53).
          cosign-release: v2.6.5
      - name: Package, checksum and sign CLI assets
        working-directory: release
        run: |
          set -euo pipefail
          tar -czf cloud-cli-skill.tar.gz -C ../skills cloud-cli
          chmod 755 cld_*
          find . -maxdepth 1 -type f -regextype posix-extended -regex './(cld_(darwin|linux)_(arm64|x64)|cloud-cli-skill\.tar\.gz)' -printf '%f\n' | sort | while read -r file; do
            sha256sum "$file"
          done > checksums.txt
          [[ "$(wc -l < checksums.txt)" == "5" ]] || { echo "Expected 4 binaries and the skill archive." >&2; cat checksums.txt; exit 1; }
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-assets
          path: release
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify-tag, cli-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-assets
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-images
          path: release
      - name: Require the release tag on every built image
        env:
          VERSION: ${{ inputs.version }}
        working-directory: release
        run: |
          set -euo pipefail
          missing=$(jq -r --arg tag "v$VERSION" '.[] | select(.tags | index($tag) | not) | .image' release-images.json)
          [[ -z "$missing" ]] || { echo "Images were not built for v$VERSION: $missing" >&2; exit 1; }
      - name: Write release.json
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
          OWNER: ${{ github.repository_owner }}
        working-directory: release
        run: |
          set -euo pipefail
          jq -n \
            --arg version "$VERSION" \
            --arg commit "$SHA" \
            --arg release "sha-${SHA:0:12}" \
            --arg registry "ghcr.io/${OWNER,,}" \
            --arg cloud "$(jq -r .version ../packages/cloud/package.json)" \
            --arg ui "$(jq -r .version ../packages/ui/package.json)" \
            --slurpfile images release-images.json \
            --rawfile checksums checksums.txt \
            '{
              version: $version,
              commit: $commit,
              release: $release,
              registry: $registry,
              images: $images[0],
              cli: ($checksums | split("\n") | map(select(length > 0) | split("  ") | {asset: .[1], sha256: .[0]})),
              npm: {"@k2b/cloud": $cloud, "@k2b/ui": $ui}
            }' > release.json
          jq . release.json
      - name: Upload assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        working-directory: release
        run: |
          set -euo pipefail
          gh release view "cloud-v$VERSION" --json tagName >/dev/null
          gh release upload "cloud-v$VERSION" --clobber \
            cld_darwin_arm64 cld_darwin_x64 cld_linux_arm64 cld_linux_x64 \
            cloud-cli-skill.tar.gz checksums.txt checksums.txt.sig checksums.txt.pem \
            release-images.json release.json

  release-smoke:
    needs: [verify-tag, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-images
          path: ${{ runner.temp }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Boot gateway, core and one app from the released digests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          APP_SECRET: ${{ env.TEST_SECRET }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${OWNER,,}"
          ref() { jq -r --arg image "$1" '.[] | select(.image == $image) | .digest' "$RUNNER_TEMP/release-images.json"; }
          for image in cloud-gateway cloud-core cloud-app-faq; do
            gh attestation verify "oci://$registry/$image@$(ref "$image")" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-images.yml"
          done
          docker network create cloud-smoke
          docker run --detach --name postgres --network cloud-smoke \
            --env POSTGRES_USER=ipa --env POSTGRES_PASSWORD=ipa --env POSTGRES_DB=ipa postgres:17-alpine
          docker run --detach --name nats --network cloud-smoke --volume "$GITHUB_WORKSPACE/.github/nats-ci.conf:/etc/nats.conf:ro" nats:2.14.3-alpine --config /etc/nats.conf
          docker run --detach --name valkey --network cloud-smoke valkey/valkey:8-alpine
          timeout 60s bash -c 'until docker exec postgres pg_isready -U ipa -d ipa; do sleep 1; done'
          common=(--network cloud-smoke
            --env NODE_ENV=production
            --env DATABASE_URL=postgresql://ipa:ipa@postgres:5432/ipa
            --env REDIS_URL=redis://valkey:6379
            --env NATS_SERVERS=nats://nats:4222
            --env SYNC_REPLICAS=1
            --env SYNC_NAMESPACE=release
            --env APP_SECRET="$APP_SECRET"
            --env CLOUD_IDENTITY_JWKS_ORIGIN=http://app-core:3000
            --env CLOUD_OAUTH_JWKS_ORIGIN=http://app-oauth:3000
            --env CLOUD_CORE_INTERNAL_ORIGIN=http://app-core:3000
            --env CLOUD_IDENTITY_KEY_ENCRYPTION_KEY=000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
            --env CLOUD_OAUTH_BROKER_SECRET=abababababababababababababababababababababababababababababababab
            --env ADMIN_LOGIN_TOKEN=release-smoke)
          docker run --detach --name app-core "${common[@]}" --publish 127.0.0.1:3001:3000 "$registry/cloud-core@$(ref cloud-core)"
          docker run --detach --name gateway "${common[@]}" --publish 127.0.0.1:3000:3000 "$registry/cloud-gateway@$(ref cloud-gateway)"
          docker run --detach --name app-faq "${common[@]}" --publish 127.0.0.1:3002:3000 "$registry/cloud-app-faq@$(ref cloud-app-faq)"
          for _attempt in {1..90}; do
            core=$(curl --silent --fail http://127.0.0.1:3001/_cloud/ready || true)
            faq=$(curl --silent --fail http://127.0.0.1:3002/_cloud/ready || true)
            routes=$(curl --silent --fail http://127.0.0.1:3000/health | jq -r '.routeTable.routeCount // 0' || echo 0)
            if [[ -n "$core" && -n "$faq" && "$routes" -ge 2 ]]; then
              echo "core: $core"; echo "faq: $faq"; echo "gateway routes: $routes"
              for ready in "$core" "$faq"; do
                [[ "$(jq -r .version <<<"$ready")" == "$VERSION" ]] || { echo "Runtime does not report version $VERSION." >&2; exit 1; }
              done
              exit 0
            fi
            sleep 2
          done
          docker logs app-core; docker logs gateway; docker logs app-faq
          exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Cosign 3 writes only Sigstore bundles; checksums.txt.sig/.pem and
          # `cld update` expect the detached signature and certificate (#53).
          cosign-release: v2.6.5
      - name: Install and update cld from the published release with full verification
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/cld-bin"
          sh packages/cloud-cli/scripts/install.sh --version "$VERSION" --prefix "$prefix" --skills-dir "$RUNNER_TEMP/cld-skills" --yes
          "$prefix/cld" --version | grep -F "$VERSION"
          "$prefix/cld" update --version "$VERSION" --yes --skills-dir "$RUNNER_TEMP/cld-skills"
          test -f "$RUNNER_TEMP/cld-skills/cloud-cli/SKILL.md"
      - if: always()
        run: docker rm --force app-core app-faq gateway postgres nats valkey || true

  npm-cloud:
    if: inputs.npm_cloud_released
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci --registry=https://registry.npmjs.org
      - name: Require published Sync recovery support
        run: |
          bun -e 'const root = await Bun.file("package.json").json(); if (Object.keys(root.patchedDependencies ?? {}).some(name => name.startsWith("@k2b/sync@"))) throw new Error("Publish and adopt the reviewed Sync release before publishing Cloud to npm; downstream consumers do not inherit this workspace patch.")'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.5.1
      - name: Verify package version matches the npm-cloud tag
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          version=$(jq -r .version packages/cloud/package.json)
          git fetch --quiet origin "refs/tags/npm-cloud-v$version:refs/tags/npm-cloud-v$version"
          [[ "$(git rev-list -n1 "npm-cloud-v$version")" == "$SHA" ]] || { echo "npm-cloud-v$version is not at $SHA." >&2; exit 1; }
          echo "NPM_TAG=$([[ "$version" == *-* ]] && echo next || echo latest)" >> "$GITHUB_ENV"
      - name: Publish unless this version is already on npm (a finished release may run again)
        working-directory: packages/cloud
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          if [[ "$(npm view "@k2b/cloud@$version" version 2>/dev/null || true)" == "$version" ]]; then
            echo "@k2b/cloud@$version is already published."; exit 0
          fi
          npm publish --provenance --access public --tag "$NPM_TAG"

  npm-ui:
    if: inputs.npm_ui_released
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci --registry=https://registry.npmjs.org
      - run: bun run --cwd packages/ui build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.5.1
      - name: Verify package version matches the npm-ui tag
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          version=$(jq -r .version packages/ui/package.json)
          git fetch --quiet origin "refs/tags/npm-ui-v$version:refs/tags/npm-ui-v$version"
          [[ "$(git rev-list -n1 "npm-ui-v$version")" == "$SHA" ]] || { echo "npm-ui-v$version is not at $SHA." >&2; exit 1; }
          echo "NPM_TAG=$([[ "$version" == *-* ]] && echo next || echo latest)" >> "$GITHUB_ENV"
      - name: Publish unless this version is already on npm (a finished release may run again)
        working-directory: packages/ui
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          if [[ "$(npm view "@k2b/ui@$version" version 2>/dev/null || true)" == "$version" ]]; then
            echo "@k2b/ui@$version is already published."; exit 0
          fi
          npm publish --provenance --access public --tag "$NPM_TAG"
