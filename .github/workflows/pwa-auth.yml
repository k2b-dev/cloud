name: Cloud Login image

on:
  pull_request:
    paths: ["pwas/pwa-auth/**", "packages/ui/**", "packages/cloud/**", "packages/*/package.json", "docs-site/package.json", "fixtures/*/package.json", "package.json", "bun.lock", "bunfig.toml", "patches/**", ".dockerignore", ".github/workflows/pwa-auth.yml"]
  push:
    tags: ["pwa-auth-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build smoke-test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: pwas/pwa-auth/Dockerfile
          load: true
          tags: cloud-pwa-auth:test
          cache-from: type=gha,scope=pwa-auth
          cache-to: type=gha,mode=max,scope=pwa-auth
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Verify production routes
        run: |
          container=$(docker run -d --read-only --cap-drop=ALL --security-opt=no-new-privileges -p 127.0.0.1:4189:3000 cloud-pwa-auth:test)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:4189/health
          bun pwas/pwa-auth/scripts/check-http.ts
      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/cloud-pwa-auth" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: startsWith(github.ref, 'refs/tags/pwa-auth-v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release image
        if: startsWith(github.ref, 'refs/tags/pwa-auth-v')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: pwas/pwa-auth/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=pwa-auth
