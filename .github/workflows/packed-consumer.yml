name: Packed Cloud consumer

on:
  pull_request:
    paths: ["packages/cloud/**", "packages/gateway/src/config.ts", "packages/ui/**", "package.json", "bun.lock", "scripts/check-cloud-packed-consumer.ts", "scripts/fixtures/packed-consumer-*.ts", "packages/core/src/**", ".github/workflows/packed-consumer.yml"]
  push:
    branches: [main]
    paths: ["packages/cloud/**", "packages/gateway/src/config.ts", "packages/ui/**", "package.json", "bun.lock", "scripts/check-cloud-packed-consumer.ts", "scripts/fixtures/packed-consumer-*.ts", "packages/core/src/**", ".github/workflows/packed-consumer.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/ui build
      - run: bun scripts/check-cloud-packed-consumer.ts
