name: Request cache integration

on:
  pull_request:
    paths:
      - "packages/cloud/**"
      - "packages/core/**"
      - "packages/ui/**"
      - "scripts/test-request-cache.ts"
      - "scripts/cache-tests/**"
      - ".github/workflows/request-cache.yml"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "packages/cloud/**"
      - "packages/core/**"
      - "packages/ui/**"
      - "scripts/test-request-cache.ts"
      - "scripts/cache-tests/**"
      - ".github/workflows/request-cache.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: request-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun run --cwd packages/ui build
      - run: bun run test:request-cache
