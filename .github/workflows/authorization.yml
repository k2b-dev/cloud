name: Authorization integration

on:
  pull_request:
    paths: ["packages/**", "scripts/fixtures/authorization-preload.ts", "package.json", "bun.lock", "patches/**", ".github/workflows/authorization.yml"]
  push:
    branches: [main]
    paths: ["packages/**", "scripts/fixtures/authorization-preload.ts", "package.json", "bun.lock", "patches/**", ".github/workflows/authorization.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cloud_authorization_test
          POSTGRES_PASSWORD: authorization
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cloud_authorization_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:authorization@127.0.0.1:5432/cloud_authorization_test
      REDIS_URL: redis://127.0.0.1:6379
      NATS_SERVERS: nats://127.0.0.1:4222
      SYNC_NAMESPACE: authorization-ci
      SYNC_REPLICAS: "1"
      APP_ID: core
      APP_SECRET: authorization-ci-only
      APP_URL: http://localhost:3000
      CLOUD_OAUTH_BROKER_SECRET: "abababababababababababababababababababababababababababababababab"
      CLOUD_IDENTITY_KEY_ENCRYPTION_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      CLOUD_DATABASE_TEST: "1"
      NOTEBOOKS_DB_TEST: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/ui build
      - name: Verify Postgres connection attribution and diagnostics
        run: bun test packages/cloud/src/_internal/postgres-application-name.test.ts packages/cloud/src/_internal/postgres-application-name.integration.test.ts packages/cloud/src/cli/admin.test.ts
      - name: Verify search result validation and provider isolation
        run: bun test packages/cloud/src/api/search.test.ts packages/cloud/src/api/search/schemas.test.ts packages/cloud/src/_internal/bounded-json.test.ts
      - name: Verify global navigation search
        run: |
          bun test packages/cloud/src/browser/search-bridge.test.ts packages/cloud/src/browser/navigation-search.test.ts packages/cloud/src/browser/resource-picker.test.ts packages/cloud/src/browser/resource-search-input.test.ts packages/cloud/src/browser/resource-search-messages.test.ts packages/tools/src/search-links.test.ts
          bun test --isolate --conditions=browser --preload ./packages/ui/test/solid-dom-preload.ts packages/cloud/src/browser/CloudResourceSearch.behavior.test.tsx packages/cloud/src/ssr/GlobalSearchDialog.behavior.test.tsx packages/cloud/src/browser/spotlight-position.test.ts
      - name: Verify contextual search providers and application navigation
        run: |
          bun test --isolate packages/cloud/src/_internal/capabilities.test.ts packages/notebooks/src/capabilities.test.ts packages/spaces/src/capabilities.test.ts packages/contacts/src/capabilities.test.ts packages/mail/src/capabilities.test.ts packages/notebooks/src/frontend/\[id\]/_components/editor/note-navigation.test.ts packages/notebooks/src/frontend/\[id\]/_components/book/book-state.test.ts
          bun test --isolate --conditions=browser --preload ./packages/ui/test/solid-dom-preload.ts packages/notebooks/src/frontend/\[id\]/_components/book/BookController.behavior.test.tsx
      - name: Verify interactive Commands and context actions
        run: |
          bun test --isolate packages/cloud/src/capabilities/command-link.test.ts packages/cloud/src/browser/command-bridge.test.ts packages/cloud/src/browser/command-shortcuts.test.ts packages/cloud/src/api/capabilities.test.ts packages/assistant/src/capabilities.test.ts packages/assistant/src/search.test.ts packages/accounts/src/search.test.ts packages/capabilities/src/search.test.ts packages/assistant/src/frontend/message-anchor.test.ts packages/assistant/src/frontend/assistant-navigation.test.ts packages/spaces/src/commands.test.ts packages/mail/src/commands.test.ts packages/mail/src/frontend/_components/mail-compose-route.test.ts packages/mail/src/api/conversation-context.test.ts
          bun test --isolate --conditions=browser --preload ./packages/ui/test/solid-dom-preload.ts packages/spaces/src/frontend/space-commands.behavior.test.tsx packages/spaces/test/keyboard-shortcuts.behavior.test.tsx packages/notebooks/src/frontend/note-commands.behavior.test.tsx packages/cloud/src/browser/commands.behavior.test.tsx packages/mail/src/frontend/_components/MailConversationContext.behavior.test.tsx packages/mail/src/frontend/_components/MailCalendarInvitation.behavior.test.tsx packages/mail/src/frontend/_components/MailComposeIntentPage.behavior.test.tsx packages/assistant/src/frontend/AssistantSidebar.commands.behavior.test.tsx packages/mail/src/frontend/_components/MailSidebar.commands.behavior.test.tsx
      - name: Verify native list search and URL state
        run: bun test --isolate packages/cloud/src/ssr/islands/SearchBar.render.test.tsx packages/cloud/src/ssr/url-filter.test.ts packages/accounts/src/frontend/groups/detail/group-detail-url.test.ts packages/gateway-ops/src/observability/logs/_components/types.test.ts
      - name: Verify Dashboard and OAuth editor behavior
        run: |
          bun test packages/dashboard/src/shared.test.ts packages/dashboard/src/frontend/messages.test.ts packages/dashboard/src/frontend/widget-request.test.ts packages/oauth/src/contracts.test.ts packages/oauth/src/frontend/messages.test.ts packages/oauth/src/frontend/_components/client-editor.test.ts
          bun test --isolate --conditions=browser --preload ./packages/ui/test/solid-dom-preload.ts packages/dashboard/src/frontend/dashboard-controls.behavior.test.tsx packages/oauth/src/frontend/_components/OAuthClientDialog.behavior.test.tsx
      - name: Start isolated JetStream
        run: docker run -d --rm --name authorization-nats -p 127.0.0.1:4222:4222 nats:2.14.3-alpine -js
      - name: Verify model access on a fresh dedicated database
        run: |
          bun --no-env-file -e 'import { sql } from "bun"; await sql`CREATE DATABASE cloud_ai_model_access_verify_ci`'
          DATABASE_URL=postgres://postgres:authorization@127.0.0.1:5432/cloud_ai_model_access_verify_ci bun --no-env-file -e 'import { migrate as auth } from "./packages/core/src/migrate/core/auth"; import { migrate as settings } from "./packages/core/src/migrate/core/settings"; await auth(); await settings()'
          DATABASE_URL=postgres://postgres:authorization@127.0.0.1:5432/cloud_ai_model_access_verify_ci CLOUD_AI_MODEL_ACCESS_TEST=1 bun --no-env-file test --timeout 15000 packages/cloud/test/integration/model-access.integration.test.ts
      - name: Migrate real Core and application schemas
        run: |
          bun -e 'import { runCoreSetup } from "./packages/core/src/runtime-helpers"; await runCoreSetup()'
          bun -e 'import { migrate } from "./packages/oauth/src/migrate"; await migrate()'
          bun -e 'import { migrate } from "./packages/notebooks/src/migrate"; await migrate()'
          bun -e 'import { migrate } from "./packages/spaces/src/migrate"; await migrate()'
          bun -e 'import { initializeSchema } from "./packages/pulse/src/schema"; await initializeSchema()'
      - name: Verify authorization against PostgreSQL
        run: |
          bun test --isolate --timeout 15000 --preload ./scripts/fixtures/authorization-preload.ts \
            packages/cloud/src/server/services/access.test.ts \
            packages/cloud/src/services/accounts/email-write.integration.test.ts \
            packages/cloud/src/services/service-account-credentials.test.ts \
            packages/cloud/src/services/notifications/batches.test.ts \
            packages/cloud/src/ai/transcription.integration.test.ts \
            packages/cloud/src/services/oauth-tokens.test.ts \
            packages/oauth/src/service/tokens.test.ts \
            packages/pulse/src/service/access-control.test.ts \
            packages/notebooks/src/service/api-key-permissions.test.ts \
            packages/notebooks/src/service/search.test.ts \
            packages/notebooks/src/service/note-query.integration.test.ts \
            packages/spaces/src/service/access.test.ts
      - name: Stop isolated JetStream
        if: always()
        run: docker rm -f authorization-nats
