name: Authorization integration

on:
  pull_request:
    paths: ["packages/**", "scripts/fixtures/authorization-preload.ts", "package.json", "bun.lock", "patches/**", ".github/workflows/authorization.yml"]
  push:
    branches: [main]
    paths: ["packages/**", "scripts/fixtures/authorization-preload.ts", "package.json", "bun.lock", "patches/**", ".github/workflows/authorization.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cloud_authorization_test
          POSTGRES_PASSWORD: authorization
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cloud_authorization_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:authorization@127.0.0.1:5432/cloud_authorization_test
      REDIS_URL: redis://127.0.0.1:6379
      NATS_SERVERS: nats://127.0.0.1:4222
      SYNC_NAMESPACE: authorization-ci
      SYNC_REPLICAS: "1"
      APP_ID: core
      APP_SECRET: authorization-ci-only
      APP_URL: http://localhost:3000
      CLOUD_OAUTH_BROKER_SECRET: "abababababababababababababababababababababababababababababababab"
      CLOUD_IDENTITY_KEY_ENCRYPTION_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      CLOUD_DATABASE_TEST: "1"
      NOTEBOOKS_DB_TEST: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/ui build
      - name: Start isolated JetStream
        run: docker run -d --rm --name authorization-nats -p 127.0.0.1:4222:4222 nats:2.14.3-alpine -js
      - name: Migrate real Core and application schemas
        run: |
          bun -e 'import { runCoreSetup } from "./packages/core/src/runtime-helpers"; await runCoreSetup()'
          bun -e 'import { migrate } from "./packages/oauth/src/migrate"; await migrate()'
          bun -e 'import { migrate } from "./packages/notebooks/src/migrate"; await migrate()'
          bun -e 'import { migrate } from "./packages/spaces/src/migrate"; await migrate()'
          bun -e 'import { initializeSchema } from "./packages/pulse/src/schema"; await initializeSchema()'
      - name: Verify authorization against PostgreSQL
        run: |
          bun test --isolate --timeout 15000 --preload ./scripts/fixtures/authorization-preload.ts \
            packages/cloud/src/server/services/access.test.ts \
            packages/cloud/src/services/service-account-credentials.test.ts \
            packages/cloud/src/services/notifications/batches.test.ts \
            packages/oauth/src/service/tokens.test.ts \
            packages/pulse/src/service/access-control.test.ts \
            packages/notebooks/src/service/api-key-permissions.test.ts \
            packages/notebooks/src/service/search.test.ts \
            packages/notebooks/src/service/note-query.integration.test.ts \
            packages/spaces/src/service/access.test.ts
      - name: Stop isolated JetStream
        if: always()
        run: docker rm -f authorization-nats
