# NATS configuration for CI jobs. Mirrors the development server: max_payload
# must cover the largest @k2b/sync publish (Notebooks Yjs full-state resync
# is about 8 MB); Sync's ready() refuses smaller servers.
max_payload: 16MB
jetstream {
  store_dir: /data
  # JetStream reserves every stream's byte limit up front, and the default
  # ceiling is 75% of the disk that is free when NATS starts. The booted
  # applications reserve Cloud's small job and queue budget (Core, Grids and
  # Mail about 9.4 GiB at one replica), but integration suites create Sync
  # instances directly, where every job, queue and dead-letter stream still
  # reserves Sync's own 1 GiB, and run in parallel. This ceiling only has to
  # stay above the reservations.
  max_file_store: 1TB
}
