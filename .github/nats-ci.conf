# NATS configuration for CI jobs. Mirrors the development server: max_payload
# must cover the largest @k2b/sync publish (Notebooks Yjs full-state resync
# is about 8 MB); Sync's ready() refuses smaller servers.
max_payload: 16MB
jetstream {
  store_dir: /data
  # JetStream reserves every stream's byte limit up front, and the default
  # ceiling is 75% of the disk that is free when NATS starts. Core, Grids and
  # Mail alone reserve about 62 GiB at one replica while storing almost nothing,
  # so the default would need about 83 GB of free disk on the runner. This
  # ceiling only has to stay above the reservations.
  max_file_store: 1TB
}
