# NATS configuration for CI jobs. Mirrors the development server: max_payload
# must cover the largest @k2b/sync publish (Notebooks Yjs full-state resync
# is about 8 MB); Sync's ready() refuses smaller servers.
max_payload: 16MB
jetstream {
  store_dir: /data
  # JetStream reserves every stream's byte limit up front and refuses a stream
  # that no longer fits. Each job starts its own server, and its peak
  # reservation at one replica is about 8.4 GiB for the nightly Core, gateway,
  # Grids and Mail stack (docs-site/docs/en/operations/deployment-requirements.md),
  # 8.1 GiB for the integration suites (the Notebooks legacy topic migration
  # test recreates three Sync 6 per-note topics), and 2.5 GiB for Grids
  # certification. The ceiling leaves about 3x headroom, so a job that
  # outgrows it fails with `insufficient storage resources available` instead
  # of silently reserving more.
  max_file_store: 24GB
}
