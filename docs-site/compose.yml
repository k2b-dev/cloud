# Isolated documentation service — run from the repository root with:
#   docker compose -f docs-site/compose.yml up --build -d --wait --renew-anon-volumes
name: cloud-fibel

services:
  fibel:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    working_dir: /app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FIBEL_PORT:-4187}:4187"
    environment:
      NODE_ENV: development
      PORT: "4187"
      CLOUD_DOCS_SITE_URL: "http://localhost:${FIBEL_PORT:-4187}"
    volumes:
      - .:/app/docs-site
      - /app/docs-site/node_modules
      - ../packages/cloud/src:/app/packages/cloud/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../packages/ui/scripts:/app/packages/ui/scripts
      - ../styles.css:/app/styles.css
    command: ["bun", "run", "--cwd", "docs-site", "dev"]
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:4187/health'); if (!response.ok) process.exit(1)",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 180s
