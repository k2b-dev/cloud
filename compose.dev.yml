# Generated by bun scripts/generate-app-deployments.ts; edit scripts/templates or the config registry.
# Dev containers — Core enrolls the isolated OAuth fixture with an explicit oauth:issue grant.
# Run with:
#   bun run dev          (core set)
#   bun run dev:full     (core + extras; --profile extra)
#   bun run dev:start FOO    (ad-hoc: start a single extra app in the running stack)
#   bun run dev:restart FOO  (reload mounted source without rebuilding the image)
#
# `bun run dev` and `bun run dev:full` start the infrastructure automatically.
#
# Gateway replaces Traefik — routes are discovered dynamically from the NATS
# app registry, so ad-hoc containers joining the same docker network (= same
# compose project name = folder name "cloud") are picked up automatically.

x-env: &env
  NODE_ENV: development
  DATABASE_URL: postgresql://ipa:ipa@ipa_postgres:5432/ipa
  REDIS_URL: redis://ipa_valkey:6379
  NATS_SERVERS: nats://ipa_nats_1:4222
  SYNC_REPLICAS: 1
  SYNC_NAMESPACE: dev
  APP_URL: ${APP_URL:-localhost:3000}
  APP_SECRET: dev-secret-change-me-in-production
  CLOUD_IDENTITY_JWKS_ORIGIN: http://app-core:3000
  CLOUD_CORE_INTERNAL_ORIGIN: http://app-core:3000
  GOTENBERG_URL: http://gotenberg:3000

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  working_dir: /app
  restart: unless-stopped
  healthcheck:
    test:
      - CMD
      - bun
      - -e
      - const response = await fetch("http://127.0.0.1:3000/_cloud/ready"); if (!response.ok) process.exit(1)
    interval: 2s
    timeout: 2s
    retries: 90
    start_period: 2s

services:
  # ══════════════════════════════════════════════════════════════════
  # Core set — started by `bun run dev`
  # ══════════════════════════════════════════════════════════════════

  gateway:
    <<: *app
    container_name: gateway
    environment: { <<: *env, APP_ID: gateway }
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./packages/cloud/src:/app/packages/cloud/src
      - ./packages/cloud/scripts:/app/packages/cloud/scripts
      - ./packages/gateway/src:/app/packages/gateway/src
      - ./styles.css:/app/styles.css
    command: bun run --preload=/app/packages/cloud/scripts/preload.ts packages/gateway/src/index.ts

  app-gateway-ops:
    secrets:
      - source: gateway-ops-app-key
        target: gateway-ops.key
    depends_on:
      app-core:
        condition: service_healthy
    environment:
      NODE_ENV: development
      APP_ID: gateway-ops
      CLOUD_APP_KEY_FILE: /run/secrets/gateway-ops.key
      CLOUD_CORE_INTERNAL_ORIGIN: http://app-core:3000
      NATS_ADMIN_SERVERS: nats://ipa_nats_1:4222
      NATS_ADMIN_NKEY_SEED_FILE: /run/secrets/nats-admin.seed
    <<: *app
    container_name: app-gateway-ops
    volumes:
      - ./.local/nats/admin.seed:/run/secrets/nats-admin.seed:ro
      - ./packages/cloud/src:/app/packages/cloud/src
      - ./packages/cloud/scripts:/app/packages/cloud/scripts
      - ./packages/gateway/src:/app/packages/gateway/src
      - ./packages/gateway-ops/src:/app/packages/gateway-ops/src
      - ./styles.css:/app/styles.css
    command: bun run --preload=/app/packages/cloud/scripts/preload.ts packages/gateway-ops/src/index.ts

  app-core:
    <<: *app
    container_name: app-core
    environment:
      <<: *env
      OUTGOING_MAIL_ALLOWED_TARGETS: ${OUTGOING_MAIL_ALLOWED_TARGETS:-}
      APP_ID: core
      CLOUD_DEV_APP_KEYS: true
      ADMIN_LOGIN_TOKEN: dev-admin
      CLOUD_OAUTH_BROKER_SECRET: ${CLOUD_OAUTH_BROKER_SECRET:-abababababababababababababababababababababababababababababababab}
      CLOUD_IDENTITY_KEY_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
    volumes:
      - ./packages/cloud/src:/app/packages/cloud/src
      - ./packages/cloud/scripts:/app/packages/cloud/scripts
      - ./packages/cloud/public:/app/packages/cloud/public
      - ./packages/core/src:/app/packages/core/src
      - ./packages/core/scripts:/app/packages/core/scripts
      - ./styles.css:/app/styles.css
    command: bun run --preload=/app/packages/cloud/scripts/preload.ts packages/core/src/index.ts

  app-dashboard:
    secrets:
      - source: dashboard-app-key
        target: dashboard.key
    depends_on:
      app-core:
        condition: service_healthy
    environment:
      NODE_ENV: development
      APP_ID: dashboard
