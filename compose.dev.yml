    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    build:
      context: .
      dockerfile: Dockerfile.dev
      args: { INSTALL_CHROMIUM: "true" }
    container_name: app-assistant
    volumes:
      - ./packages/cloud/src:/app/packages/cloud/src
      - ./packages/cloud/scripts:/app/packages/cloud/scripts
      - ./packages/assistant/src:/app/packages/assistant/src
      - ./styles.css:/app/styles.css
    command: bun run --preload=/app/packages/cloud/scripts/preload.ts packages/assistant/src/index.ts

