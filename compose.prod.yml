# Production deployment template — single host, behind an existing Traefik.
#
# This file does NOT define `postgres`, `valkey`, `nats-1..3`, or `filegate`.
# Add them yourself (the apps reference `postgres:5432`, `valkey:6379`, and a
# three-node NATS JetStream cluster at `nats-1..3:4222` with max_payload >= 16MB,
# and depend on a `postgres` service with a healthcheck). See README and
# compose.yml for an example.
#
# Configure via .env (see .env.prod.example).

x-shared-env: &shared-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://valkey:6379
  NATS_SERVERS: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
  SYNC_NAMESPACE: ${SYNC_NAMESPACE:-prod}
  # Optional NATS auth/TLS: paths inside the app containers. Mount the files
  # into every app service (e.g. via a shared `volumes:` entry on
  # x-app-defaults) and set the paths in .env.
  NATS_CREDS_FILE: ${NATS_CREDS_FILE:-}
  NATS_TLS_CA_FILE: ${NATS_TLS_CA_FILE:-}
  APP_SECRET: ${APP_SECRET}
  APP_URL: https://${CLOUD_HOST}
  CLOUD_IDENTITY_JWKS_ORIGIN: http://app-core:3000
  CLOUD_OAUTH_JWKS_ORIGIN: http://app-oauth:3000
  CLOUD_CORE_INTERNAL_ORIGIN: http://app-core:3000

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks: [cloud-internal]
  environment: *shared-env

networks:
  cloud-internal:
    driver: bridge
  traefik:
    external: true

services:
  # Gateway — the only service exposed to Traefik.
  gateway:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-gateway:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}
    networks: [cloud-internal, traefik]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cloud.rule=Host(`${CLOUD_HOST}`)"
      - "traefik.http.routers.cloud.entrypoints=websecure"
      - "traefik.http.routers.cloud.tls.certresolver=le"
      - "traefik.http.services.cloud.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik"

  app-gateway-ops:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-gateway-ops:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  # Apps — internal only, reached through the gateway.
  app-core:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-core:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}
    environment:
      <<: *shared-env
      APP_ID: core
      CLOUD_OAUTH_BROKER_SECRET: ${CLOUD_OAUTH_BROKER_SECRET:?CLOUD_OAUTH_BROKER_SECRET is required}
      CLOUD_IDENTITY_KEY_ENCRYPTION_KEY: ${CLOUD_IDENTITY_KEY_ENCRYPTION_KEY:?CLOUD_IDENTITY_KEY_ENCRYPTION_KEY is required}
      CLOUD_IDENTITY_NEXT_KEY: ${CLOUD_IDENTITY_NEXT_KEY:-}
      CLOUD_IDENTITY_PREVIOUS_KEY: ${CLOUD_IDENTITY_PREVIOUS_KEY:-}

  app-accounts:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-accounts:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-api-docs:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-api-docs:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-assistant:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-assistant:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-capabilities:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-capabilities:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-contacts:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-contacts:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-dashboard:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-dashboard:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-faq:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-faq:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-files:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-files:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-grids:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-grids:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-ipa-hosts:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-ipa-hosts:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-mail:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-mail:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}
    environment:
      <<: *shared-env
      CLOUD_APP_CREDENTIAL: ${CLOUD_MAIL_APP_CREDENTIAL:-}

  app-notebooks:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-notebooks:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-oauth:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-oauth:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}
    environment:
      <<: *shared-env
      CLOUD_OAUTH_BROKER_SECRET: ${CLOUD_OAUTH_BROKER_SECRET:?CLOUD_OAUTH_BROKER_SECRET is required}

  app-proxy-auth:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-proxy-auth:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-quotes:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-quotes:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-spaces:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-spaces:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-tools:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-tools:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-venue:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-venue:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}

  app-weather:
    <<: *app-defaults
    image: ghcr.io/valentinkolb/cloud-app-weather:${CLOUD_IMAGE_TAG:?CLOUD_IMAGE_TAG is required}
