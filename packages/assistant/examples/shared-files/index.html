<main>
  <h1>Files and documents</h1>
  <p id="status" role="status">Select a file, then download it. Each source shows one page.</p>
  <figure>
    <table>
      <thead><tr><th>File</th><th>Source</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </figure>
  <div class="row">
    <button type="button" id="next-grids">Next Grids page</button>
    <button type="button" id="next-files">Next Files page</button>
    <button type="button" id="download" class="primary">Download selected file</button>
  </div>
</main>
